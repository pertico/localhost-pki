# ==========================================
# CONFIGURACIÓN GLOBAL
# ==========================================
[ ca ]
default_ca = intermediate_ca # CA por defecto si no se especifica otra

# ==========================================
# 1. SECCIÓN ROOT CA (Nivel 1)
# ==========================================
[ root_ca ]
dir               = /home/rgm/localhost-pki/openssl-ca/rootca
certs             = $dir/certs
crl_dir           = $dir/crl
new_certs_dir     = $dir/newcerts
database          = $dir/index.txt
serial            = $dir/serial
RANDFILE          = $dir/private/.rand

private_key       = $dir/private/rootca.key
certificate       = $dir/certs/rootca.crt

default_md        = sha384
default_days      = 7300 # 20 años
policy            = policy_strict
x509_extensions   = v3_root_ca

# ==========================================
# 2. SECCIÓN INTERMEDIATE CA (Nivel 2)
# ==========================================
[ intermediate_ca ]
dir               = /home/rgm/localhost-pki/openssl-ca/intermediate
certs             = $dir/certs
crl_dir           = $dir/crl
new_certs_dir     = $dir/newcerts
database          = $dir/index.txt
serial            = $dir/serial
crlnumber         = $dir/crlnumber
RANDFILE          = $dir/private/.rand

private_key       = $dir/private/intermediate.key
certificate       = $dir/certs/intermediate.crt

default_md        = sha384
default_days      = 3650 # 10 años
policy            = policy_loose
x509_extensions   = v3_intermediate_ca

# ==========================================
# SECCIÓN SUB-INTERMEDIATE CA WEB (Nivel 3)
# ==========================================
[ sub_ca_web ]
dir               = /home/rgm/localhost-pki/openssl-ca/subca_web
certs             = $dir/certs
crl_dir           = $dir/crl
new_certs_dir     = $dir/newcerts
database          = $dir/index.txt
serial            = $dir/serial
crlnumber         = $dir/crlnumber
RANDFILE          = $dir/private/.rand

private_key       = $dir/private/subca_web.key
certificate       = $dir/certs/subca_web.crt

default_md        = sha384
default_days      = 1825 # 5 años
policy            = policy_loose

# ==========================================
# POLÍTICAS DE ATRIBUTOS (Subject DN)
# ==========================================
[ policy_strict ]
countryName             = optional
stateOrProvinceName     = optional
organizationName        = optional
organizationalUnitName  = optional
commonName              = supplied
emailAddress            = optional

[ policy_loose ]
countryName             = optional
stateOrProvinceName     = optional
localityName            = optional
organizationName        = optional
organizationalUnitName  = optional
commonName              = supplied
emailAddress            = optional

# ==========================================
# CONFIGURACIÓN DE SOLICITUDES (req)
# ==========================================
[ req ]
default_bits        = 4096
distinguished_name  = req_distinguished_name
string_mask         = utf8only
default_md          = sha384

[ req_distinguished_name ]
countryName                     = Country Name (2 letter code)
stateOrProvinceName             = State or Province Name
localityName                    = Locality Name
0.organizationName              = Organization Name
organizationalUnitName          = Organizational Unit Name
commonName                      = Common Name

# ==========================================
# EXTENSIONES X.509 v3 SEPARADAS
# ==========================================
# Extensiones para el certificado Autofirmado Root
[ v3_root_ca ]
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid:always,issuer
basicConstraints = critical, CA:true
keyUsage = critical, digitalSignature, cRLSign, keyCertSign

# Extensiones para la Intermedia de Nivel 2 (FIRMADA POR ROOT)
[ v3_intermediate_ca ]
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid:always,issuer
basicConstraints = critical, CA:true, pathlen:1
keyUsage = critical, digitalSignature, cRLSign, keyCertSign

# Extensiones para las Sub-Intermedias de Nivel 3 (FIRMADAS POR INTERMEDIATE)
[ v3_sub_ca ]
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid:always,issuer
basicConstraints = critical, CA:true, pathlen:0
keyUsage = critical, digitalSignature, cRLSign, keyCertSign

# ==========================================
# EXTENSIONES PARA CERTIFICADOS HOJA (SERVIDORES)
# ==========================================
[ server_cert ]
basicConstraints = CA:FALSE
nsCertType = server
keyUsage = critical, digitalSignature, keyEncipherment
extendedKeyUsage = serverAuth
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid,issuer

# ==========================================
# EXTENSIONES PARA SERVIDORES CON SAN
# ==========================================
[ server_san_cert ]
basicConstraints = CA:FALSE
nsCertType = server
keyUsage = critical, digitalSignature, keyEncipherment
extendedKeyUsage = serverAuth
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid,issuer
subjectAltName = @alt_names

[ alt_names ]
DNS.1 = localhost
DNS.2 = *.localhost
IP.1  = 127.0.0.1